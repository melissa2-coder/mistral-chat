<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat Mistral</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        height: 100dvh;
        max-width: 720px;
        margin-inline: auto;
      }
      h1 {
        font-size: 1.1rem;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid #8884;
      }
      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .msg {
        padding: 0.5rem 0.75rem;
        border-radius: 0.75rem;
        max-width: 80%;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .msg.user {
        align-self: flex-end;
        background: #0b6eef;
        color: white;
      }
      .msg.assistant {
        align-self: flex-start;
        background: #88822222;
      }
      .msg.error {
        align-self: stretch;
        color: #d33;
        background: transparent;
      }
      form {
        display: flex;
        gap: 0.5rem;
        padding: 0.75rem;
        border-top: 1px solid #8884;
      }
      input {
        flex: 1;
        padding: 0.6rem 0.75rem;
        border: 1px solid #8886;
        border-radius: 0.5rem;
        font: inherit;
        background: transparent;
        color: inherit;
      }
      button {
        padding: 0.6rem 1rem;
        border: none;
        border-radius: 0.5rem;
        background: #0b6eef;
        color: white;
        font: inherit;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <h1>Chat Mistral — <code>mistral-small-latest</code></h1>
    <div id="messages"></div>
    <form id="chat-form">
      <input id="input" type="text" placeholder="Votre message…" autocomplete="off" autofocus />
      <button type="submit">Envoyer</button>
    </form>
    <script>
      const messagesEl = document.getElementById("messages");
      const form = document.getElementById("chat-form");
      const input = document.getElementById("input");
      const button = form.querySelector("button");
      const history = [];

      function addBubble(role, text) {
        const div = document.createElement("div");
        div.className = "msg " + role;
        div.textContent = text;
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return div;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        input.value = "";
        button.disabled = true;
        addBubble("user", text);
        const pending = addBubble("assistant", "…");
        history.push({ role: "user", content: text });

        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ messages: history }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "Erreur inconnue");
          history.push({ role: "assistant", content: data.content });
          pending.textContent = data.content;
        } catch (err) {
          pending.className = "msg error";
          pending.textContent = "Erreur : " + err.message;
        } finally {
          button.disabled = false;
          input.focus();
        }
      });
    </script>
  </body>
</html>
